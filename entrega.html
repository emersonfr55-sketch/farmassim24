<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmassim 24hrs - Gestão de Entregas & Supabase</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        farmassim: {
                            50: '#eefdf4', 100: '#d7fbe2', 200: '#b0f5c6', 300: '#75ea9c',
                            500: '#008337', 600: '#006B2B', 700: '#005421', 800: '#00421a', 900: '#002e12',
                        },
                        farmassimYellow: { 400: '#ffe033', 500: '#ffd700', 600: '#e6c200' }
                    }
                }
            }
        }
    </script>
    <style>
        .logo-text { font-style: italic; font-weight: 900; letter-spacing: -0.03em; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @media print {
            body * { visibility: hidden; }
            #areaImpressao, #areaImpressao * { visibility: visible; }
            #areaImpressao { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="font-sans antialiased h-full text-slate-800 bg-slate-100 flex flex-col min-h-screen">

    <!-- CABEÇALHO PADRONIZADO E LIMPO -->
    <header class="bg-farmassim-600 text-white shadow-lg sticky top-0 z-40 border-b-4 border-farmassimYellow-500">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row items-center justify-between py-3 gap-3">
                <div class="flex items-center space-x-3 w-full md:w-auto justify-between md:justify-start">
                    <div class="flex items-center space-x-3">
                        <div class="bg-white p-1.5 sm:p-2 rounded-xl shadow-md flex items-center justify-center">
                            <span class="text-xs font-black text-farmassim-900 px-1">FARMASSIM</span>
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <h1 class="font-extrabold text-lg sm:text-2xl tracking-tight logo-text text-white drop-shadow">FARMASSIM <span class="text-farmassimYellow-500">24hrs</span></h1>
                            </div>
                            <p class="text-xs text-farmassim-100 font-medium flex items-center gap-1.5">
                                <i class="fa-solid fa-motorcycle text-farmassimYellow-400"></i> Sistema de Entregas
                            </p>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-2 w-full md:w-auto justify-end flex-wrap">
                    <a href="index.html" class="bg-farmassim-700 hover:bg-farmassim-800 text-white font-extrabold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5 shadow-md border border-farmassim-500/50 transition-all">
                        <i class="fa-solid fa-house text-farmassimYellow-400"></i> Portal
                    </a>
                    <a href="fechamento.html" class="bg-farmassim-700 hover:bg-farmassim-800 text-white font-extrabold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5 shadow-md border border-farmassim-500/50 transition-all">
                        <i class="fa-solid fa-file-invoice-dollar text-farmassimYellow-400"></i> Fechamento
                    </a>
                    <a href="codigos.html" class="bg-farmassim-700 hover:bg-farmassim-800 text-white font-extrabold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5 shadow-md border border-farmassim-500/50 transition-all">
                        <i class="fa-solid fa-barcode text-farmassimYellow-400"></i> Códigos
                    </a>

                    <div id="btnStatusDbDiscreto" title="Status da Conexão com o Banco de Dados" class="bg-farmassim-700/60 hover:bg-farmassim-700 text-white px-2.5 py-1.5 rounded-xl text-[11px] font-medium flex items-center gap-1.5 border border-farmassim-500/30 transition-all cursor-default">
                        <span id="badgeStatusSupabase" class="flex items-center gap-1.5">
                            <i class="fa-solid fa-circle-notch fa-spin text-amber-400"></i> <span class="hidden sm:inline">DB:</span> Conectando...
                        </span>
                    </div>

                    <button onclick="abrirConsultaHistorico()" class="bg-farmassim-700 hover:bg-farmassim-800 text-white font-extrabold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5 shadow-md border border-farmassim-500/50 transition-all">
                        <i class="fa-solid fa-clock-rotate-left text-farmassimYellow-400"></i> Histórico
                    </button>
                    <button onclick="openModal('modalCadastros')" class="bg-farmassimYellow-500 text-farmassim-900 hover:bg-farmassimYellow-400 font-extrabold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5 shadow-md transition-all">
                        <i class="fa-solid fa-gear"></i> Cadastros
                    </button>
                    <button onclick="sairDoSistema()" class="bg-rose-700 hover:bg-rose-800 text-white font-extrabold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5 shadow-md border border-rose-500/50 transition-all" title="Sair do Portal">
                        <i class="fa-solid fa-right-from-bracket"></i> Sair
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <div id="toast" class="hidden fixed bottom-5 right-5 z-50 flex items-center p-4 text-slate-800 bg-white rounded-xl shadow-2xl border-l-4 border-farmassim-
