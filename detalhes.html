<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmassim 24hrs - Detalhes do Fechamento</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
    <!-- Cabeçalho -->
    <div class="bg-emerald-600 text-white p-6 text-center relative">
      <div class="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-3 backdrop-blur-sm">
        <i class="fa-solid fa-file-invoice-dollar text-3xl text-white"></i>
      </div>
      <h1 class="text-xl font-bold">Farmassim 24hrs</h1>
      <p class="text-xs text-emerald-100 mt-1">Conferência de Caixa em Dinheiro</p>
    </div>

    <!-- Conteúdo / Detalhes -->
    <div id="loading" class="p-8 text-center text-slate-500">
      <i class="fa-solid fa-circle-notch fa-spin text-2xl text-emerald-600 mb-2"></i>
      <p class="text-sm">A carregar detalhes do fechamento...</p>
    </div>

    <div id="conteudoDetalhes" class="hidden p-6 space-y-4">
      <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 space-y-2 text-sm">
        <div class="flex justify-between items-center border-b border-slate-200 pb-2">
          <span class="text-slate-500">Data/Hora:</span>
          <span id="lblData" class="font-semibold text-slate-700"></span>
        </div>
        <div class="flex justify-between items-center border-b border-slate-200 pb-2">
          <span class="text-slate-500">Operador:</span>
          <span id="lblOperador" class="font-semibold text-slate-700"></span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-slate-500">Terminal:</span>
          <span id="lblCaixa" class="font-semibold text-slate-700"></span>
        </div>
      </div>

      <!-- Valores -->
      <div class="space-y-2">
        <div class="flex justify-between items-center text-sm px-2">
          <span class="text-slate-600">Valor Informado (Sistema):</span>
          <span id="lblSistema" class="font-bold text-slate-800"></span>
        </div>
        <div class="flex justify-between items-center text-sm px-2">
          <span class="text-slate-600">Valor Contado (Gaveta):</span>
          <span id="lblGaveta" class="font-bold text-slate-800"></span>
        </div>
      </div>

      <!-- Card Diferença -->
      <div id="cardDiferenca" class="p-4 rounded-xl text-center border mt-4">
        <span class="block text-xs font-bold uppercase tracking-wider mb-1">Diferença Final</span>
        <span id="lblDiferenca" class="text-2xl font-black"></span>
      </div>

      <!-- Rodapé do Card -->
      <div class="text-center pt-2">
        <span class="inline-flex items-center gap-1.5 text-xs text-emerald-700 bg-emerald-50 px-3 py-1.5 rounded-full font-medium">
          <i class="fa-solid fa-circle-check"></i> Registo Autêntico Verificado
        </span>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const urlParams = new URLSearchParams(window.location.search);
      const dataHash = urlParams.get('data');

      if (dataHash) {
        try {
          const jsonString = atob(decodeURIComponent(dataHash));
          const dados = JSON.parse(jsonString);

          document.getElementById('lblData').innerText = dados.data || '-';
          document.getElementById('lblOperador').innerText = dados.op || '-';
          document.getElementById('lblCaixa').innerText = dados.cx || '-';
          document.getElementById('lblSistema').innerText = 'R$ ' + dados.sis;
          document.getElementById('lblGaveta').innerText = 'R$ ' + dados.gav;

          const difVal = parseFloat(dados.dif);
          const lblDif = document.getElementById('lblDiferenca');
          const cardDif = document.getElementById('cardDiferenca');

          lblDif.innerText = 'R$ ' + dados.dif;

          if (difVal < 0) {
            cardDif.className = "p-4 rounded-xl text-center border border-red-200 bg-red-50 text-red-700";
          } else if (difVal > 0) {
            cardDif.className = "p-4 rounded-xl text-center border border-emerald-200 bg-emerald-50 text-emerald-700";
          } else {
            cardDif.className = "p-4 rounded-xl text-center border border-slate-200 bg-slate-50 text-slate-700";
          }

          document.getElementById('loading').classList.add('hidden');
          document.getElementById('conteudoDetalhes').classList.remove('hidden');

        } catch (e) {
          document.getElementById('loading').innerHTML = `
            <i class="fa-solid fa-triangle-exclamation text-3xl text-amber-500 mb-2"></i>
            <p class="text-sm font-semibold text-slate-700">Erro ao ler dados do QR Code</p>
            <p class="text-xs text-slate-400 mt-1">O código pode estar corrompido ou ser inválido.</p>
          `;
        }
      } else {
        document.getElementById('loading').innerHTML = `
          <i class="fa-solid fa-circle-info text-3xl text-slate-400 mb-2"></i>
          <p class="text-sm font-semibold text-slate-700">Nenhum registo encontrado</p>
          <p class="text-xs text-slate-400 mt-1">Digitalize o QR Code impresso no cupom para ver os detalhes.</p>
        `;
      }
    });
  </script>
</body>
</html>
